<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buzón CUC Escucha</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f4; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); width: 400px; border-top: 5px solid #cc0000; }
        h2 { color: #cc0000; text-align: center; margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        input, textarea { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; background-color: #cc0000; color: white; border: none; padding: 12px; border-radius: 4px; cursor: pointer; font-size: 16px; transition: 0.3s; }
        button:hover { background-color: #a00000; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Buzón CUC Escucha</h2>
        <form>
            <label>Nombre Completo:</label>
            <input type="text" placeholder="Tu nombre..." required>
            
            <label>Correo Institucional:</label>
            <input type="email" placeholder="ejemplo@cuc.edu.co" required>
            
            <label>Semestre:</label>
            <input type="number" min="1" max="10" placeholder="Ej: 4" required>
            
            <label>Mensaje o Sugerencia:</label>
            <textarea rows="4" placeholder="Escribe aquí..."></textarea>
            
            <button type="button" onclick="alert('¡Sugerencia enviada con éxito!')">Enviar Sugerencia</button>
        </form>
    </div>
</body>
</html>
